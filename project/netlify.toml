[build]
  publish = "public"
  command = ""

# Proxy contractor profiles through to the Cloud Function so per-contractor
# SEO meta tags are correct for crawlers. Replace YOUR_PROJECT_ID below.
[[redirects]]
  from = "/contractor/*"
  to = "https://us-central1-YOUR_PROJECT_ID.cloudfunctions.net/renderContractorProfile/:splat"
  status = 200
  force = true

# admin.html is a real static file — no rewrite needed to reach it directly.
# Netlify serves public/404.html automatically for any unmatched path.

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
